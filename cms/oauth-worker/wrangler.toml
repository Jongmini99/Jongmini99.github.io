# Decap CMS GitHub OAuth 프록시 — Cloudflare Workers 무료 플랜으로 운영 가능
# 배포: docs/CMS_SETUP.md 참고
name = "decap-oauth"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# 토큰을 전달받을 수 있는 사이트 출처 (쉼표 구분, 경로 없이)
ALLOWED_ORIGINS = "https://jongmini99.github.io"
# Decap config의 auth_scope 와 일치시킨다 (공개 저장소: public_repo)
ALLOWED_SCOPES = "public_repo"

# 비밀값은 이 파일에 쓰지 않는다. 아래 명령으로 등록:
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
